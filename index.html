<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BATTLEZONE EMULATOR</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="screen"></canvas>
<div id="status">loading ROMs…</div>
<div id="controls">
  <button id="btn-coin" title="Insert coin (C)">COIN</button>
  <button id="btn-start" title="Start (Enter)">START</button>
  <button id="btn-pause" title="Pause (F)">❚❚</button>
  <button id="btn-step" title="Step one NMI period while paused">&gt;|</button>
  <input id="speed" type="range" min="0.1" max="1" step="0.05" value="1">
  <span id="speedval">1.00x</span>
</div>
<div id="tread-left" class="tread"></div>
<div id="tread-right" class="tread"></div>
<button id="btn-fire">FIRE</button>
<div id="help">arrows/WASD drive · Q/Z + P/? treads · SPACE fire · ENTER start · C coin</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
