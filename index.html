<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BATTLEZONE EMULATOR</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="screen"></canvas>
<div id="status">loading ROMs…</div>
<div id="controls">
  <button id="btn-coin" title="Insert coin (C)">COIN</button>
  <button id="btn-start" title="Start (Enter)">START</button>
  <button id="btn-pause" title="Pause (F)">❚❚</button>
  <button id="btn-step" title="Step one NMI period while paused">&gt;|</button>
  <button id="btn-sound" title="Mute / unmute">MUTE</button>
  <button id="btn-top" title="Top-down overlay (T) · Z freezes the field · +/- zoom · drag corner to resize">TOP</button>
  <button id="btn-freeze" class="hidden" title="Freeze the top-down field (Z)">FRZ</button>
  <span class="lbl">SPD</span>
  <input id="speed" type="range" min="0.6" max="1" step="0.01" value="0.93">
  <span id="speedval">0.93x</span>
  <span class="lbl">TONE</span>
  <input id="tone" type="range" min="0.3" max="2" step="0.05" value="0.6"
         title="Pitch of engine/shell/explosion (the analog board approximation)">
  <span id="toneval">0.60x</span>
</div>
<div id="tread-left" class="tread"><div class="knob"></div></div>
<div id="tread-right" class="tread"><div class="knob"></div></div>
<button id="btn-fire">FIRE</button>
<div id="help">arrows/WASD drive · Q/Z + P/? treads · SPACE fire · ENTER start · C coin</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
